name: Build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: keypress-visualizer

jobs:
  build:
    name: Build (linux-x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgl1-mesa-dev \
            libwayland-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/release/${{ env.BIN_NAME }} dist/${{ env.BIN_NAME }}-linux-x86_64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-linux-x86_64
          path: dist/${{ env.BIN_NAME }}-linux-x86_64
          if-no-files-found: error

  release:
    name: Attach binary to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-linux-x86_64
          path: dist

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.BIN_NAME }}-linux-x86_64
          generate_release_notes: true
